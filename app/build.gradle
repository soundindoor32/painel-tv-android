plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.soundindoor.paineltv'
    compileSdk 34

    // Chave de assinatura FIXA do projeto — sem isso, cada compilação nova no
    // GitHub Actions gerava uma chave de teste ALEATÓRIA diferente, e o Android
    // recusa instalar um app "por cima" de outro quando a assinatura não bate
    // (proteção de segurança do próprio sistema). Com essa chave fixa, todo
    // build a partir de agora usa sempre a MESMA assinatura, permitindo
    // atualizar o app sem precisar desinstalar o anterior.
    signingConfigs {
        debug {
            storeFile file("soundindoor-debug.keystore")
            storePassword "soundindoor123"
            keyAlias "soundindoor-debug"
            keyPassword "soundindoor123"
        }
    }

    defaultConfig {
        applicationId "com.soundindoor.paineltv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
}
