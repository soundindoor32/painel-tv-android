name: Compilar APK do Painel TV

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Java (necessário pra compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3
        with:
          # o pacote "tools" é antigo e foi descontinuado/removido dos
          # servidores do Google — sem especificar isso aqui, a própria
          # ação tenta instalar "tools platform-tools" por padrão, e a
          # compilação inteira falha logo nessa etapa de preparação.
          # platform-tools é tudo que essa etapa precisa fornecer; o
          # Gradle baixa sozinho a plataforma/build-tools certos do
          # projeto (compileSdk etc.) durante a compilação em si.
          packages: "platform-tools"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Compilar o APK (versão de teste/debug)
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: painel-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
